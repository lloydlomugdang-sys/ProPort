name: proport_app
description: "GradPort — Career Development & Portfolio Builder for College Students."
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  image_picker: ^1.2.2
  http: ^1.6.0
  flutter_secure_storage: ^10.3.1
  file_picker: 11.0.3
  http_parser: 4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/proport_logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/proport_logo.png"
  adaptive_icon_background: "#166088"
  adaptive_icon_foreground: "assets/images/proport_logo.png"
  min_sdk_android: 21
